services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: digi-raise-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  dynamodb-setup:
    image: amazon/aws-cli:latest
    container_name: digi-raise-dynamodb-setup
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DynamoDB Local to be ready..."
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 > /dev/null 2>&1; do
          echo "  still waiting..."
          sleep 2
        done
        echo "DynamoDB Local is ready."

        echo "Creating DigiRaiseConnections table..."
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name DigiRaiseConnections \
          --attribute-definitions \
            AttributeName=connectionId,AttributeType=S \
            AttributeName=roomCode,AttributeType=S \
          --key-schema AttributeName=connectionId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --global-secondary-indexes '[
            {
              "IndexName": "roomCode-index",
              "KeySchema": [{"AttributeName": "roomCode", "KeyType": "HASH"}],
              "Projection": {"ProjectionType": "ALL"}
            }
          ]' 2>/dev/null || echo "DigiRaiseConnections already exists, skipping."

        echo "Creating DigiRaiseRooms table..."
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name DigiRaiseRooms \
          --attribute-definitions AttributeName=roomCode,AttributeType=S \
          --key-schema AttributeName=roomCode,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || echo "DigiRaiseRooms already exists, skipping."

        echo "Creating DigiRaiseConfig table..."
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name DigiRaiseConfig \
          --attribute-definitions AttributeName=configKey,AttributeType=S \
          --key-schema AttributeName=configKey,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || echo "DigiRaiseConfig already exists, skipping."

        echo "Inserting maintenance_mode initial record..."
        aws dynamodb put-item \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name DigiRaiseConfig \
          --item '{"configKey": {"S": "maintenance_mode"}, "value": {"BOOL": false}, "updatedAt": {"N": "0"}}' 2>/dev/null || true

        echo "DynamoDB Local setup complete!"
