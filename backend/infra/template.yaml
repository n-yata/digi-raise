AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DigiRaise Battle WebSocket Backend

# ============================================================
# Parameters
# ============================================================
Parameters:
  HmacSecretKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /digi-raise/hmac-secret-key
    Description: HMAC secret key for request validation (SSM Parameter Store)

  AlertEmail:
    Type: String
    Description: Email address for CloudWatch alarm notifications (required at deploy time)

# ============================================================
# Globals
# ============================================================
Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        ROOMS_TABLE: !Ref RoomsTable
        CONFIG_TABLE: !Ref ConfigTable
        SECRET_KEY: !Ref HmacSecretKey
        API_GATEWAY_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # WebSocket API Gateway
  # ----------------------------------------------------------
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: digi-raise-battle-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 50
      RouteSettings:
        $connect:
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

  # $connect route
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations"

  # $disconnect route
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations"

  # $default route
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub "integrations/${MessageIntegration}"

  MessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations"

  # ----------------------------------------------------------
  # Lambda Functions
  # ----------------------------------------------------------

  # Shared IAM policy for DynamoDB and API Gateway Management API access
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DigiRaiseLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DynamoDB CRUD
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub "${ConnectionsTable.Arn}/index/*"
                  - !GetAtt RoomsTable.Arn
                  - !GetAtt ConfigTable.Arn
              # API Gateway Management API (PostToConnection)
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/POST/@connections/*"

  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-connect"
      CodeUri: ../dist/connect/
      Handler: bootstrap
      Role: !GetAtt LambdaExecutionRole.Arn

  ConnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect"

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-disconnect"
      CodeUri: ../dist/disconnect/
      Handler: bootstrap
      Role: !GetAtt LambdaExecutionRole.Arn

  DisconnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect"

  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-message"
      CodeUri: ../dist/message/
      Handler: bootstrap
      Role: !GetAtt LambdaExecutionRole.Arn

  MessageFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MessageFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default"

  EmergencyShutdownFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-emergency-shutdown"
      CodeUri: ../dist/emergency-shutdown/
      Handler: bootstrap
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref AlertTopic

  # ----------------------------------------------------------
  # DynamoDB Tables
  # ----------------------------------------------------------

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DigiRaiseConnections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: roomCode
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: roomCode-index
          KeySchema:
            - AttributeName: roomCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DigiRaiseRooms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: roomCode
          AttributeType: S
      KeySchema:
        - AttributeName: roomCode
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DigiRaiseConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: configKey
          AttributeType: S
      KeySchema:
        - AttributeName: configKey
          KeyType: HASH

  # ----------------------------------------------------------
  # SNS Topic & Subscription
  # ----------------------------------------------------------

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: digi-raise-alert
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ----------------------------------------------------------
  # CloudWatch Alarms
  # ----------------------------------------------------------

  ConnectionSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: digi-raise-connection-spike
      AlarmDescription: WebSocket connection count exceeded 50
      Namespace: AWS/ApiGateway
      MetricName: ConnectCount
      Dimensions:
        - Name: ApiId
          Value: !Ref WebSocketApi
        - Name: Stage
          Value: !Ref WebSocketStage
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  LambdaSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: digi-raise-lambda-spike
      AlarmDescription: Lambda invocation count exceeded 1,000 per hour
      # Sum of all 4 Lambda functions combined (using Metric Math)
      Metrics:
        - Id: connect_invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ConnectFunction
            Period: 3600
            Stat: Sum
          ReturnData: false
        - Id: disconnect_invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DisconnectFunction
            Period: 3600
            Stat: Sum
          ReturnData: false
        - Id: message_invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref MessageFunction
            Period: 3600
            Stat: Sum
          ReturnData: false
        - Id: shutdown_invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref EmergencyShutdownFunction
            Period: 3600
            Stat: Sum
          ReturnData: false
        - Id: total_invocations
          Expression: "connect_invocations + disconnect_invocations + message_invocations + shutdown_invocations"
          ReturnData: true
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

# ============================================================
# Outputs
# ============================================================
Outputs:
  WebSocketUrl:
    Description: WebSocket endpoint URL (wss://)
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-WebSocketUrl"

  ApiGatewayEndpoint:
    Description: API Gateway Management endpoint URL (https://) for PostToConnection
    Value: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayEndpoint"
